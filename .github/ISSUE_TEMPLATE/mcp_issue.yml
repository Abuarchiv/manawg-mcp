name: MCP server problem
description: A tool, resource or prompt that fails, returns the wrong data or does not match the app.
body:
  - type: input
    id: tool
    attributes:
      label: Tool, resource or prompt
      placeholder: expense_create
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you call, what came back, and what did you expect? Leave out credentials and WG codes.
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Setup
      description: Hosted (mcp.manawg.com) or self-hosted, transport, MCP client and server version.
      placeholder: hosted, Claude Code 2.1
